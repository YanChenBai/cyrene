name: CI and Preview

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  preview:
    name: Preview Packages
    needs: ci
    uses: ./.github/workflows/pkg-pr-new.yml
    permissions:
      contents: read
