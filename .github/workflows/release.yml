name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: '24'
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build packages
        run: vp run -r build

      - name: Format, lint and typecheck
        run: vp check

      - name: Test
        run: vp test run

      - name: Create Release PR or publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: >-
            bash -c "vp exec changeset status --output .git/release-status.json && vp exec changeset version && vp install --lockfile-only"
          publish-script: >-
            bash -c "vp run -r build && vp exec changeset publish"
          commit-message: 'chore(release): version packages'
          pr-title: 'release: packages'
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Format release PR title and body with Changesets summaries
        if: steps.changesets.outputs.pr-number != ''
        run: vp exec oxnode scripts/release-pr.ts --status .git/release-status.json --pr "$RELEASE_PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
